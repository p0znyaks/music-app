events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  # Do not advertise the exact nginx build to anyone probing the port.
  server_tokens off;

  upstream backend {
    server backend:3000;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/certs/server-cert.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_name localhost;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> backend. Audio proxying needs long timeouts: tracks stream slowly
    # by design so the client can start playing before the track is downloaded.
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
    }

    # Audio cache on disk
    location /audio/ {
      alias /audio_cache/;
      add_header Accept-Ranges bytes;
      expires 7d;
    }

    # SPA fallback -> static frontend bundle
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}