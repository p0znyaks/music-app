name: CI

# `dev` is where development happens; `main` only ever receives merges that
# already passed this pipeline, so main is always green.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A new push to the same branch cancels the previous run: no point queueing up
# five builds of the same commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- secrets
  # cookies.txt holds a real YouTube session and *.pem are TLS private keys.
  # Both were once committed by accident; this job makes sure they cannot
  # come back unnoticed.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a secret file is tracked by git
        run: |
          tracked=$(git ls-files | grep -Ei '(^|/)(cookies\.txt|.*\.(pem|key|p12|pfx))$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::These secret files are tracked in git and must be removed:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret files are tracked."

      - name: Fail if .env is tracked by git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '::error::.env is tracked in git; only .env.example may be committed.'
            exit 1
          fi
          echo '.env is not tracked.'

  # ---------------------------------------------------------------- backend
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        # `npm ci` fails loudly if package.json and the lock file disagree,
        # which is exactly what we want.
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Check formatting
        working-directory: backend
        run: npm run format:check

      # tsconfig has noUnusedLocals/noUnusedParameters, so this also rejects
      # dead imports, variables and parameters.
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Python syntax check
        working-directory: backend
        run: python3 -m py_compile scripts/ytmusic_worker.py

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install
        working-directory: frontend/app
        run: npm ci

      - name: Lint
        working-directory: frontend/app
        run: npm run lint

      - name: Check formatting
        working-directory: frontend/app
        run: npm run format:check

      # Production build: type checks every reachable file and applies the
      # budgets configured in angular.json.
      - name: Build
        working-directory: frontend/app
        run: npm run build

      - name: Unit tests
        working-directory: frontend/app
        run: npm test -- --watch=false

  # ------------------------------------------------------------------ docker
  docker:
    name: Docker (compose config, image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml declares `env_file: .env` and bind-mounts
      # cookies.txt, neither of which is in the repository. Compose refuses to
      # even render the file without them, so provide placeholders first.
      - name: Provide local-only placeholder files
        run: |
          cp .env.example .env
          touch cookies.txt

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: muze-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend/nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          load: true
          tags: muze-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------ smoke: stack
  # Proves the whole thing actually starts with the freshly built images,
  # which unit tests cannot show.
  smoke:
    name: Smoke test (stack boots, /api/health answers)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: muze-backend:ci
          cache-from: type=gha

      - name: Build frontend/nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          load: true
          tags: muze-nginx:ci
          cache-from: type=gha

      - name: Placeholder cookies file
        run: touch cookies.txt

      - name: Minimal environment
        run: cp .env.example .env

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sk https://localhost:8443/api/health | grep -q '"status":"ok"'; then
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy in time."
          docker compose logs --tail 100
          exit 1

      - name: Service status
        if: always()
        run: docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v