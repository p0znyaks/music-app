services:
  postgres:
    image: postgres:16
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app_network

  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - app_network
    volumes:
      - audio_cache:/app/audio_cache

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "1443:1443"
    restart: always
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  audio_cache:
  redis_data:

networks:
  app_network:
    driver: bridge